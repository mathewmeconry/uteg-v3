name: CI

on:
  pull_request:
    branches: ['**']
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Check and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: uteg
          POSTGRES_PASSWORD: uteg
          POSTGRES_DB: uteg
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://uteg:uteg@localhost:5433/uteg
      APP_URL: http://localhost:5199
      BETTER_AUTH_SECRET: only-used-for-tests-in-ci-0123456789

    steps:
      - uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm prisma:generate
      - name: Check formatting
        run: pnpm run format:check
      - name: Check types
        run: pnpm run typecheck
      - name: Run ESLint
        run: pnpm run lint
      - name: Run tests
        run: pnpm run test:ci
      - name: Build
        run: pnpm run build

  e2e:
    name: End-to-end test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: uteg
          POSTGRES_PASSWORD: uteg
          POSTGRES_DB: uteg
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://uteg:uteg@localhost:5433/uteg

    steps:
      - uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm prisma:generate
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run the end-to-end test
        run: pnpm e2e
      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
